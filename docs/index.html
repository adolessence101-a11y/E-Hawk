<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EchoHawk In-Cab Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.4.0/ggwave.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.3rem; color: #58a6ff; margin: 0 0 4px 0; }
    p { font-size: 0.82rem; color: #8b949e; margin: 0 0 16px 0; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }
    .badge-idle { background: #30363d; color: #8b949e; }
    .badge-live { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb; }
    .badge-ok   { background: #23863622; color: #3fb950; border: 1px solid #238636; }
    .btn {
      background: #238636;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }
    .btn:active { background: #2ea043; }
    .meter-container {
      width: 100%;
      height: 8px;
      background: #0d1117;
      border-radius: 4px;
      margin: 14px 0;
      overflow: hidden;
      border: 1px solid #30363d;
    }
    .meter-bar { height: 100%; width: 0%; background: #3fb950; transition: width 0.05s ease-out; }
    .token-display {
      display: none;
      margin-top: 16px;
      background: #23863615;
      border: 1px solid #238636;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
    }
    .token-display h3 { color: #3fb950; margin: 0 0 8px 0; font-size: 1.05rem; }
    .token-display div { font-size: 0.85rem; margin-bottom: 6px; word-break: break-all; }
    .action-banner {
      background: #1f6feb22;
      border: 1px solid #1f6feb;
      border-radius: 8px;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
      color: #58a6ff;
      font-weight: bold;
      text-align: center;
    }
    .log-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px;
      margin-top: 14px;
      font-family: monospace;
      font-size: 0.75rem;
      text-align: left;
      height: 110px;
      overflow-y: auto;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>EchoHawk In-Cab Terminal</h1>
    <p>Air-Gapped Acoustic Telematics Pass</p>

    <div id="badge" class="badge badge-idle">OFFLINE (TAP TO ARM)</div>
    <button id="mainBtn" class="btn" onclick="startReceiver()">ARM ACOUSTIC RECEIVER</button>

    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>

    <div id="tokenBox" class="token-display">
      <h3>✓ GATE CLEARANCE TOKEN ISSUED</h3>
      <div id="actionBanner" class="action-banner">OVERRIDE: REROUTE TO BAY 4</div>
      <div><b>Decoded Directive:</b> <span id="outPayload" style="color:#3fb950; font-weight:bold;">--</span></div>
      <div><b>Target Lane:</b> <span style="color:#f0883e; font-weight:bold;">REEFER QUARANTINE BAY 4</span></div>
      <div><b>Physical Integrity:</b> <span style="color:#3fb950;">REED-SOLOMON VERIFIED [AIR-GAP OK]</span></div>
    </div>

    <div id="logs" class="log-box">Status: Ready. Tap button to arm mic.</div>
  </div>

  <script>
    let ggwave = null;
    let ggInstance = null;
    let audioCtx = null;
    let micStream = null;
    let isLive = false;

    function log(msg) {
      const b = document.getElementById("logs");
      if (b) {
        b.innerHTML += `<div>${msg}</div>`;
        b.scrollTop = b.scrollHeight;
      }
    }

    // Official ggwave typed array converter for Wasm boundary
    function convertTypedArray(src, type) {
      const buffer = new ArrayBuffer(src.byteLength);
      new src.constructor(buffer).set(src);
      return new type(buffer);
    }

    async function startReceiver() {
      if (isLive) return;
      log("Compiling Wasm modem runtime...");

      try {
        ggwave_factory().then(async (factory) => {
          ggwave = factory;

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass({ sampleRate: 48000 });
          await audioCtx.resume();

          // Initialize instance for both audible and ultrasound protocols
          const parameters = ggwave.getDefaultParameters();
          parameters.sampleRateInp = audioCtx.sampleRate;
          parameters.sampleRateOut = audioCtx.sampleRate;
          ggInstance = ggwave.init(parameters);

          log(`✓ Wasm initialized (${audioCtx.sampleRate} Hz)`);

          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = audioCtx.createMediaStreamSource(micStream);
          const recorder = audioCtx.createScriptProcessor(1024, 1, 1);

          recorder.onaudioprocess = function (e) {
            const input = e.inputBuffer.getChannelData(0);

            // Live VU meter
            let sum = 0;
            for (let i = 0; i < input.length; i += 8) sum += Math.abs(input[i]);
            let amp = (sum / (input.length / 8)) * 100;
            const bar = document.getElementById("meterBar");
            if (bar) bar.style.width = Math.min(100, amp * 5) + "%";

            // Pass 1024-sample Int8 block into ggwave decode
            const res = ggwave.decode(ggInstance, convertTypedArray(new Float32Array(input), Int8Array));
            if (res && res.length > 0) {
              const text = new TextDecoder("utf-8").decode(res);
              log("★ DECODED: " + text);
              displayPass(text);
            }
          };

          source.connect(recorder);
          recorder.connect(audioCtx.destination);

          isLive = true;
          document.getElementById("mainBtn").style.display = "none";
          document.getElementById("badge").className = "badge badge-live";
          document.getElementById("badge").innerText = `LISTENING (${audioCtx.sampleRate} Hz)`;
          log("✓ Listening for inaudible ultrasound / audible tones.");
        });

      } catch (err) {
        log("❌ Error: " + err.message);
      }
    }

    function displayPass(text) {
      document.getElementById("badge").className = "badge badge-ok";
      document.getElementById("badge").innerText = "PASS AUTHENTICATED & VERIFIED";
      document.getElementById("outPayload").innerText = text;
      document.getElementById("tokenBox").style.display = "block";
    }
  </script>
</body>
</html>
